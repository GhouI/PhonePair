[package]
name = "phonepair-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "26a28f6a46b5d85a28043c2e62febfa394c8b0a6", default-features = false, features = ["remote_pairing", "rustcrypto"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
serde_json = "1"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
